<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Countries I have visited</title>
    <base href="/visited-countries/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="./style.css" rel="stylesheet" type="text/css" />
    <link href="./favicon.ico" rel="icon" type="image/png" />
    <script src="./d3.v4.min.js"></script>
    <script src="./countries.js"></script>
    <script src="./script.js"></script>
    <meta property="og:title" content="Countries I have visited" />
    <meta
      property="og:description"
      content="Interactive map of countries visited by Riccardo Cannistrà"
    />
    <meta
      property="og:image"
      content="https://richmondweb.it/visited-countries/backpack.png"
    />
    <meta
      property="og:url"
      content="https://richmondweb.it/visited-countries/"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="canonical"
      href="https://richmondweb.it/visited-countries/"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Interactive map of countries visited by Riccardo Cannistrà, showcasing travel experiences around the world."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Countries I have visited",
        "description": "Interactive map of countries visited by Riccardo Cannistrà",
        "author": {
          "@type": "Person",
          "name": "Riccardo Cannistrà",
          "url": "https://www.richmondweb.it"
        }
      }
    </script>
  </head>
  <body>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a class="breadcrumb-link" href="/">Home</a>
      <span class="breadcrumb-sep" aria-hidden="true">/</span>
      <span class="breadcrumb-current" aria-current="page">Visited countries</span>
    </nav>
    <header id="header">
      <img src="./backpack.png" alt="Backpack icon" title="Backpack icon" />
      <h1>Riccardo's</h1>
      <h2 class="subheader">🌍 visited countries 🌎</h2>
      <div id="header-info">
        <div id="statistic">
          <div class="number-section">
            <span class="passport-stamp">
              <span id="number-countries" class="information"></span>
              <span class="stamp-label">countries</span>
            </span>
            <span class="divider">•</span>
            <span class="numbers">
              <span id="globe-percent"></span>
              <span>of</span>
              <a
                target="_blank"
                href="http://en.wikipedia.org/wiki/Member_states_of_the_United_Nations"
              >193</a>
            </span>
          </div>
        </div>
      </div>
    </header>
    <div id="countries-modal" class="modal">
      <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h3>🌍 Visited Countries</h3>
        <ul id="countries-list"></ul>
      </div>
    </div>
    <main id="map">
      <div id="svg" class="full-map"></div>
      <div id="country-tooltip"></div>
    </main>
    <footer id="footer">
      <div class="footer-content">
        <p class="footer-quote">🌟 "The world is a book, and those who do not travel read only one page" 🌟</p>
        <h4>
          <a href="https://github.com/glauberramos/visited-countries/" target="_blank">📂 Credits</a>
          <span class="footer-divider">✦</span>
        </h4>
      </div>
    </footer>
  </body>
</html>
